<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Game - Étape Hanse</title>
    <style>
        /* Charte graphique */
        body {
            font-family: "American Typewriter", serif;
            background-color: #FFFFFF;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Logo en haut au centre */
        #logo {
            max-width: 200px;
            margin-bottom: 30px;
        }

        /* Images responsives */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
        }

        /* Style des sections */
        .section {
            margin-bottom: 40px;
            padding: 20px 0;
        }

        /* Masquer les sections non débloquées */
        .hidden {
            display: none;
        }

        /* Champs de saisie et boutons */
        input[type="text"] {
            font-family: "American Typewriter", serif;
            padding: 12px;
            font-size: 16px;
            width: 70%;
            max-width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
            text-align: center;
        }

        button {
            font-family: "American Typewriter", serif;
            padding: 12px 24px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }

        button:hover {
            background-color: #555;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Message d'erreur */
        .error-msg {
            color: #d9534f;
            font-weight: bold;
            display: none;
            margin-top: 10px;
        }
        
        /* Texte de l'énigme */
        .texte-enigme {
            font-size: 18px;
            line-height: 1.5;
            padding: 10px 20px;
        }

        /* Effet dynamique sur le mot BATEAU (effet de flottaison / tangage) */
        @keyframes tangage {
            0% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-3px) rotate(3deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(3px) rotate(-3deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        .bateau-dynamique {
            display: inline-block;
            font-weight: bold;
            color: #005b9f; /* Un bleu marin pour accentuer le mot */
            animation: tangage 2.5s infinite ease-in-out;
        }

        /* Conteneur vidéo YouTube Portrait (9:16) */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            aspect-ratio: 9 / 16;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO -->
        <img src="HANSE.png" alt="Logo de l'étape" id="logo">

        <!-- PARTIE QUESTION -->
        <div id="section-question" class="section">
            <h2>Question d’observation</h2>
            <img src="Entree_vieux_port_La_Rochelle.JPG" alt="Photo de la question">
            <p>Combien de tours compte le Vieux-Port de La Rochelle ?</p>
            
            <input type="text" id="reponse-question" placeholder="Saisissez votre réponse">
            <button id="btn-question" onclick="validerQuestion()">Valider</button>
            <p id="erreur-question" class="error-msg">Mauvaise réponse, essayez à nouveau</p>
        </div>

        <!-- PARTIE ÉNIGME (Masquée par défaut) -->
        <div id="section-enigme" class="section hidden">
            <hr>
            <h2>Énigme</h2>
            <p class="texte-enigme">Pour être un bon journaliste il convient de porter attention aux petits détails et de ne pas se laisser mener en <span class="bateau-dynamique">BATEAU</span> !</p>
            <br>
            <input type="text" id="reponse-enigme" placeholder="Saisissez votre réponse">
            <button id="btn-enigme" onclick="validerEnigme()">Valider</button>
            <p id="erreur-enigme" class="error-msg">Mauvaise réponse, essayez à nouveau</p>
        </div>

        <!-- PARTIE INDICE (Masquée par défaut) -->
        <div id="section-indice" class="section hidden">
            <hr>
            <h2>Indice</h2>
            <div class="video-container">
                <!-- L'URL de la vidéo sera injectée en JS pour forcer l'autoplay au clic -->
                <iframe id="video-indice" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE FONCTIONNEMENT -->
    <script>
        // Fonction pour retirer les accents et passer en minuscules
        function formaterReponse(texte) {
            return texte.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        }

        // Validation de la QUESTION
        function validerQuestion() {
            const saisie = document.getElementById("reponse-question").value;
            const reponsePropre = formaterReponse(saisie);
            const erreur = document.getElementById("erreur-question");

            // Vérification (2 ou deux) - inchangée
            if (reponsePropre === "2" || reponsePropre === "deux") {
                erreur.style.display = "none";
                
                // On affiche la partie énigme
                document.getElementById("section-enigme").classList.remove("hidden");
                
                // On désactive le champ et le bouton de la question
                document.getElementById("reponse-question").disabled = true;
                document.getElementById("btn-question").disabled = true;
                
                // Scroll doux vers l'énigme
                document.getElementById("section-enigme").scrollIntoView({ behavior: 'smooth' });
            } else {
                erreur.style.display = "block";
            }
        }

        // Validation de l'ÉNIGME
        function validerEnigme() {
            const saisie = document.getElementById("reponse-enigme").value;
            const reponsePropre = formaterReponse(saisie);
            const erreur = document.getElementById("erreur-enigme");

            // Vérification pour la nouvelle réponse : "Caravelle" (gère aussi caravelle, CARAVELLE, etc.)
            if (reponsePropre === "caravelle") {
                erreur.style.display = "none";
                
                // On affiche la partie indice
                document.getElementById("section-indice").classList.remove("hidden");
                
                // On désactive le champ et le bouton de l'énigme
                document.getElementById("reponse-enigme").disabled = true;
                document.getElementById("btn-enigme").disabled = true;

                // Lancement de la nouvelle vidéo YouTube (ID: XNt_e0MjD6U)
                const iframe = document.getElementById("video-indice");
                iframe.src = "https://www.youtube.com/embed/XNt_e0MjD6U?autoplay=1&rel=0";

                // Requête de passage en plein écran
                if (iframe.requestFullscreen) {
                    iframe.requestFullscreen();
                } else if (iframe.webkitRequestFullscreen) { /* Safari / Chrome */
                    iframe.webkitRequestFullscreen();
                } else if (iframe.msRequestFullscreen) { /* IE11 */
                    iframe.msRequestFullscreen();
                }

                // Scroll doux vers la vidéo
                document.getElementById("section-indice").scrollIntoView({ behavior: 'smooth' });
            } else {
                erreur.style.display = "block";
            }
        }
    </script>
</body>
</html>
